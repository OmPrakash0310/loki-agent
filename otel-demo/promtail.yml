# Reads every OTel Demo service's container output and ships it to Grafana Loki.
# Several demo services (payment, checkout, shipping, email, ...) only log to stdout,
# so this is the one source that covers all of them.
server: { http_listen_port: 9080 }
positions: { filename: /tmp/positions.yaml }
clients: [{ url: http://grafana-loki:3100/loki/api/v1/push }]
scrape_configs:
  - job_name: otel-demo
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters: [{ name: label, values: ["com.docker.compose.project=opentelemetry-demo"] }]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service_name
      # The demo's own tooling, not the store.
      - source_labels: [service_name]
        regex: (otel-collector|jaeger|grafana|prometheus|opensearch)
        action: drop
