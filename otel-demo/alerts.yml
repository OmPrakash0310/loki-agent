# Alerts on the demo's span metrics. The demo's traffic is low (a few calls a minute per
# service), so rates use a 5m window. Errors are counted on every span kind: the
# demo's failures are often recorded on internal spans, not server spans.
groups:
  - name: otel-demo
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
            / sum by (service_name) (rate(traces_span_metrics_calls_total[5m])) > 0.05
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service_name }} error rate is {{ $value | humanizePercentage }}"
      - alert: HighLatency
        # Span durations are in milliseconds. flagd holds streaming connections open for
        # minutes by design, so its "latency" is always huge: leave it out.
        expr: |
          histogram_quantile(0.95,
            sum by (le, service_name) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER",service_name!="flagd"}[5m]))) > 1000
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service_name }} p95 latency is {{ $value | humanize }}ms"
