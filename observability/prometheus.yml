global:
  scrape_interval: 5s      # collect metrics every 5s
  evaluation_interval: 5s  # check alert rules every 5s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: services
    static_configs:
      - targets: ["shop-api:8000", "payments-svc:8000"]
    # The client library's CPU/memory series (process_*) carry only instance="shop-api:8000".
    # Give them the same service label the app's own metrics have. (Can't be a target label:
    # it would rename the app metrics' own "service" label to exported_service.)
    metric_relabel_configs:
      - source_labels: [__name__, instance]
        regex: "process_.+;([^:]+):.*"
        target_label: service
        replacement: "$1"
