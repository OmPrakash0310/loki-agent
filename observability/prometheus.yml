global:
  scrape_interval: 5s      # collect metrics every 5s
  evaluation_interval: 5s  # check alert rules every 5s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: services
    static_configs:
      - targets: ["shop-api:8000", "payments-svc:8000"]
