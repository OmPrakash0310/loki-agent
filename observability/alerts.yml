groups:
  - name: services
    rules:
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[1m]))
            / sum by (service) (rate(http_requests_total[1m])) > 0.05
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} error rate is {{ $value | humanizePercentage }}"
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[1m]))) > 1
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 latency is {{ $value | humanizeDuration }}"
