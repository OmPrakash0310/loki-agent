# A small, separate copy of the demo app for trying scenarios without Loki:
#   docker compose -p loki-chaos -f evals/live/docker-compose.chaos.yml up -d --build
#   python3 scripts/scenario_runner.py evals/scenarios/train/<id>.json \
#       --shop-url http://localhost:18201 --payments-url http://localhost:18202 \
#       --deploys-file /tmp/loki-chaos-deploys.json --ground-truth-file /tmp/loki-chaos-truth.jsonl
#   docker compose -p loki-chaos -f evals/live/docker-compose.chaos.yml down -v --rmi local
# 5 containers, host ports 182xx only, no Loki/Grafana/agent: logs via `docker logs`,
# metrics and alerts via Prometheus on :18290.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: shop }
    volumes: [../../db/init.sql:/docker-entrypoint-initdb.d/init.sql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "shop"]
      interval: 2s
      retries: 20
  payments-svc:
    build:
      context: ../../services/payments-svc
      additional_contexts: { probes: ../../probes/python }
    environment: { DATABASE_URL: postgresql://app:app@postgres:5432/shop }
    ports: ["18202:8000"]
    depends_on: { postgres: { condition: service_healthy } }
  shop-api:
    build: ../../services/shop-api
    environment: { PAYMENTS_URL: http://payments-svc:8000 }
    ports: ["18201:8000"]
    depends_on: [payments-svc]
  loadgen:
    build: ../../services/loadgen
    depends_on: [shop-api]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../../observability/alerts.yml:/etc/prometheus/alerts.yml
    ports: ["18290:9090"]
