#cloud-config
# New VPS self-install (Ubuntu 22.04/24.04). Paste as "user data" when creating the server.
# Fill in the four values below. The repo must be readable from the VPS: public, or use a
# read-only deploy key / a release tarball URL instead of git clone.
# Secrets generated by install.sh end up in /opt/loki/loki.env (mode 600); fetch the
# webhook URLs afterwards with:  ssh root@<vps> loki urls
package_update: true
packages: [git, ca-certificates, curl, openssl, ufw, unattended-upgrades]
write_files:
  - path: /root/loki-install.env
    permissions: "0600"
    content: |
      LOKI_DOMAIN=loki.customer.example.com
      LOKI_ACME_EMAIL=ops@example.com
      LOKI_VERSION=0.1.0
      LOKI_REPO=https://github.com/TurboTrade-TT/incident-agent.git
runcmd:
  - [bash, -c, "ufw allow OpenSSH && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable"]
  - [bash, -c, "set -a; . /root/loki-install.env; set +a; git clone --depth 1 --branch v$LOKI_VERSION $LOKI_REPO /opt/loki-src"]
  - [bash, -c, "umask 077; set -a; . /root/loki-install.env; set +a; /opt/loki-src/deploy/install.sh --yes --domain $LOKI_DOMAIN --email $LOKI_ACME_EMAIL --version $LOKI_VERSION > /var/log/loki-install.log 2>&1"]
  - [shred, -u, /root/loki-install.env]
final_message: "Loki install finished; see /var/log/loki-install.log"
